name: Build OpcDaToUaGateway

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 创建 Release 需要仓库写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $csproj = Get-Content OpcDaToUaGateway.csproj -Raw
          if ($csproj -match '<Version>(.*?)</Version>') { $v = $Matches[1] } else { $v = '1.5.0' }
          echo "APP_VERSION=$v" >> $env:GITHUB_OUTPUT
          Write-Host "构建版本: $v"

      # windows-latest 预装 Visual Studio（含 .NET 桌面开发工作负载），
      # 提供 net472 目标包与 Windows Forms 引用程序集，可直接 dotnet build net472。
      - name: Restore
        run: dotnet restore OpcDaToUaGateway.sln

      - name: Build (Release)
        run: dotnet build OpcDaToUaGateway.sln -c Release -v minimal

      - name: 打包版本化产物（排除 Keygen/Watchdog）
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.APP_VERSION }}'
          $rel = "OpcDaToUaGateway-v$v"
          $source = "bin/Release/net472"
          $exclude = @("OpcDaToUaGateway.Keygen.exe", "OpcDaToUaGateway.Watchdog.exe")
          New-Item -ItemType Directory -Force -Path $rel | Out-Null

          # 客户发布包只包含主程序、必要 DLL、config.json；Keygen 和 Watchdog 均不得进入客户包
          if (Test-Path $source) {
            $sourcePath = (Resolve-Path $source).Path
            Get-ChildItem $source -Recurse | ForEach-Object {
              if ($exclude -contains $_.Name) { return }
              $relativePath = $_.FullName.Substring($sourcePath.Length).TrimStart('\')
              $targetPath = Join-Path $rel $relativePath
              if ($_.PSIsContainer) {
                New-Item -ItemType Directory -Path $targetPath -Force | Out-Null
              } else {
                Copy-Item $_.FullName $targetPath -Force
              }
            }
          }

          Compress-Archive -Path $rel -DestinationPath "$rel.zip" -Force
          Write-Host "已生成版本化包: $rel.zip (已排除 Keygen/Watchdog)"

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpcDaToUaGateway-v${{ steps.version.outputs.APP_VERSION }}
          path: ${{ github.workspace }}/OpcDaToUaGateway-v${{ steps.version.outputs.APP_VERSION }}
          if-no-files-found: warn

      - name: 创建 GitHub Release（仅打 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpcDaToUaGateway v${{ steps.version.outputs.APP_VERSION }}
          files: OpcDaToUaGateway-v${{ steps.version.outputs.APP_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
